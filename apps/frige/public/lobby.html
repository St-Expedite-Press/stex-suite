<!doctype html>
<html lang="en" data-stex-app="frige">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frige projects · STEX</title>
  <meta name="theme-color" content="#0B1518">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./design-system/src/stex.css">
  <link rel="stylesheet" href="./masthead.css">
  <link rel="stylesheet" href="./lobby.css">
</head>
<body class="frige-lobby">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead masthead--full">
    <div class="masthead-art" aria-hidden="true">
      <picture>
        <source media="(max-width: 899px)" srcset="./media/masthead/pantheon-masthead-still-960w.webp">
        <img class="masthead-still" alt="" width="1920" height="288" fetchpriority="high" decoding="async" src="./media/masthead/pantheon-masthead-still-1920w.webp" srcset="./media/masthead/pantheon-masthead-still-1280w.webp 1280w, ./media/masthead/pantheon-masthead-still-1920w.webp 1920w" sizes="100vw">
      </picture>
      <video class="masthead-motion" muted loop playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1">
        <!-- Codec strings are the encoded profile and level recorded for P11 in assets/manifest.json. -->
        <source media="(max-width: 899px)" src="./media/masthead/pantheon-masthead-loop-960w.webm" type='video/webm; codecs="av01.0.01M.10"'>
        <source media="(max-width: 899px)" src="./media/masthead/pantheon-masthead-loop-960w.mp4" type='video/mp4; codecs="avc1.64001E"'>
        <source media="(max-width: 1279px)" src="./media/masthead/pantheon-masthead-loop-1280w.webm" type='video/webm; codecs="av01.0.01M.10"'>
        <source media="(max-width: 1279px)" src="./media/masthead/pantheon-masthead-loop-1280w.mp4" type='video/mp4; codecs="avc1.64001E"'>
        <source src="./media/masthead/pantheon-masthead-loop-1920w.webm" type='video/webm; codecs="av01.0.04M.10"'>
        <source src="./media/masthead/pantheon-masthead-loop-1920w.mp4" type='video/mp4; codecs="avc1.64001F"'>
      </video>
    </div>
    <a class="masthead-brand" href="./">
      <img class="masthead-emblem" alt="" width="194" height="65" src="./media/studios/frige-emblem-194w.webp" srcset="./media/studios/frige-emblem-194w.webp 1x, ./media/studios/frige-emblem-388w.webp 2x">
      <span class="stex-wordmark masthead-wordmark"><span class="stex-wordmark__org"><abbr title="St. Expedite Press">STEX</abbr></span> <span class="stex-wordmark__name">Frige</span></span>
    </a>
  </header>
  <nav class="studio-bar" aria-label="Frige">
    <a class="back-link" href="/home/" data-shell-link hidden><span aria-hidden="true">‹</span> Pantheon</a>
    <button class="motion-toggle" type="button" hidden><span class="motion-verb">Pause</span> <span class="motion-noun">motion</span></button>
  </nav>
  <main class="page" id="main">
    <header class="page-head">
      <p class="eyebrow">Publishing and typography</p>
      <h1 class="page-title">Book projects</h1>
      <p class="page-lede">Choose a local manuscript workspace. Frige will not open or alter a book until you select it.</p>
    </header>
    <section aria-labelledby="projects-title">
      <h2 class="section-title" id="projects-title">Select a project</h2>
      <form id="create-project" class="create-project">
        <label>Book title<input name="title" maxlength="140" required placeholder="Working title"></label>
        <label>Author <span>(optional)</span><input name="author" maxlength="160" placeholder="Name for the title page"></label>
        <button type="submit" class="stex-button stex-button--primary">Create book project</button>
        <p id="create-state" aria-live="polite"></p>
      </form>
      <div id="projects" class="projects" aria-live="polite"><p class="empty">Loading local projects…</p></div>
    </section>
  </main>
  <script src="./runtime-config.js"></script>
  <script type="module" src="./masthead.js"></script>
  <script type="module" src="./lobby.js"></script>
</body>
</html>
