name: CI

# Runs the whole suite, including test:stex-igor-sync (the design-system and
# masthead copies inside the private stex-igor submodule must match their
# sources here). stex-igor is private, so fetching it needs the repository
# secret STEX_IGOR_READ_SSH_KEY: the private half of an Igor-only, read-only
# deploy key. The gate verifies access by checking out the exact pinned commit
# without LFS.
# Missing access fails CI; a skipped test job is never release verification.
# Fork code never receives a private checkout or the deploy credential.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      igor-sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Require a trusted repository branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SAME_REPOSITORY" != "true" ]; then
            echo "::error::Full verification requires private Igor. A maintainer must review fork changes and verify them on a trusted same-repository branch; fork code receives no private checkout."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: pin
        name: Read the declared Igor revision
        run: |
          sha=$(git ls-tree HEAD stex-igor | awk '$1 == "160000" && $2 == "commit" && $4 == "stex-igor" { print $3 }')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The suite does not declare a valid Igor submodule revision."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require the read-only Igor deploy credential
        env:
          KEY_AVAILABLE: ${{ secrets.STEX_IGOR_READ_SSH_KEY != '' }}
        run: |
          if [ "$KEY_AVAILABLE" != "true" ]; then
            echo "::error::Private Igor verification requires the owner-authorized read-only deploy key in STEX_IGOR_READ_SSH_KEY. CI cannot accept skipped tests."
            exit 1
          fi
      - name: Verify checkout access to the exact private Igor revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: St-Expedite-Press/stex-igor
          ref: ${{ steps.pin.outputs.sha }}
          path: .igor-pin-check
          ssh-key: ${{ secrets.STEX_IGOR_READ_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          # A full (non-LFS) checkout: a sparse partial clone makes the
          # action's credential cleanup fetch .gitmodules after the key is gone.
          lfs: false
      - name: Confirm the verified Igor revision
        env:
          IGOR_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          if [ "$(git -C .igor-pin-check rev-parse HEAD)" != "$IGOR_SHA" ]; then
            echo "::error::The verified Igor checkout does not match the suite's declared revision."
            exit 1
          fi

  test:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: St-Expedite-Press/stex-igor
          ref: ${{ needs.gate.outputs.igor-sha }}
          path: stex-igor
          ssh-key: ${{ secrets.STEX_IGOR_READ_SSH_KEY }}
          ssh-strict: true
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # pnpm comes from corepack in the next step; v5 would otherwise try to cache it first.
          package-manager-cache: false
      # The Python platform API (test:platform) runs through uv on the pinned .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.26
      - run: uv sync --frozen
      - name: Install real proof and preflight prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-luatex texlive-latex-recommended lmodern poppler-utils
          lualatex --version
          for package in fontspec.sty microtype.sty geometry.sty; do
            test -n "$(kpsewhich "$package")"
          done
          pdffonts -v
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:pantheon
      - run: corepack pnpm test
