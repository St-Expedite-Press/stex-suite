name: CI

# Runs the whole suite, including test:stex-igor-sync (the design-system and
# masthead copies inside the private stex-igor submodule must match their
# sources here). stex-igor is private, so fetching it needs the repository
# secret STEX_IGOR_READ_TOKEN: a fine-grained token with read-only Contents
# access to St-Expedite-Press/stex-igor. The existing organization secret
# HF_GITHUB_WRITE is a compatibility fallback only when the dedicated secret
# is absent. Its scope is not assumed: the gate probes the exact pinned
# commit, using the credential only for read requests even if it is broader.
# Missing access fails CI; a skipped test job is never release verification.
# Fork code never receives a private checkout or an organization credential.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      igor-sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Require a trusted repository branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SAME_REPOSITORY" != "true" ]; then
            echo "::error::Full verification requires private Igor. A maintainer must review fork changes and verify them on a trusted same-repository branch; fork code receives no private checkout."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: pin
        name: Read the declared Igor revision
        run: |
          sha=$(git ls-tree HEAD stex-igor | awk '$1 == "160000" && $2 == "commit" && $4 == "stex-igor" { print $3 }')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The suite does not declare a valid Igor submodule revision."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Verify read access to the exact private Igor revision
        env:
          TOKEN: ${{ secrets.STEX_IGOR_READ_TOKEN || secrets.HF_GITHUB_WRITE }}
          IGOR_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No existing credential can verify private Igor. The owner must provide STEX_IGOR_READ_TOKEN with read-only Contents access to St-Expedite-Press/stex-igor."
            exit 1
          fi
          if ! status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/St-Expedite-Press/stex-igor/commits/$IGOR_SHA"); then
            echo "::error::Private Igor access could not be verified because the GitHub request failed."
            exit 1
          fi
          echo "Private Igor commit probe HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::The configured credential cannot read the declared Igor commit. The owner must verify that commit exists and provide STEX_IGOR_READ_TOKEN with read-only Contents access; CI cannot accept skipped tests."
            exit 1
          fi

  test:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: St-Expedite-Press/stex-igor
          ref: ${{ needs.gate.outputs.igor-sha }}
          path: stex-igor
          token: ${{ secrets.STEX_IGOR_READ_TOKEN || secrets.HF_GITHUB_WRITE }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # pnpm comes from corepack in the next step; v5 would otherwise try to cache it first.
          package-manager-cache: false
      - name: Install real proof and preflight prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-luatex texlive-latex-recommended lmodern poppler-utils
          lualatex --version
          for package in fontspec.sty microtype.sty geometry.sty; do
            test -n "$(kpsewhich "$package")"
          done
          pdffonts -v
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:pantheon
      - run: corepack pnpm test
