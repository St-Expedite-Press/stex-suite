# Hosted-style overlay for the staging stack: real Igor password sign-in through Pantheon,
# behind a TLS edge, with the platform and Frige in hosted (actor-verifying) mode.
#
#   node scripts/verify/verify-staging-hosted.mjs    # generates fixtures, starts, verifies
#
# Only the edge is published, as https://pantheon.stex.test:8443 on the host's loopback.
# Pantheon, Igor, Frige and the platform have no published ports. Accounts and secrets come
# from STEX_STAGING_FIXTURES and the --env-file the verifier writes outside the repository.
services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      pantheon: { condition: service_healthy }
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
    ports:
      - "127.0.0.1:8443:8443"
    networks: [edge, studio]

  igor:
    build: { context: ../.., dockerfile: deploy/staging-compose/node.Dockerfile, target: igor }
    environment:
      STEX_BIND_ALL: "1"
      STEX_INTERNAL_HOSTS: igor
      STEX_IGOR_DATA_DIR: /data/igor
      STEX_IGOR_PUBLIC_ORIGIN: https://pantheon.stex.test:8443
      STEX_IGOR_AUTH: password
      STEX_IGOR_USERS_FILE: /fixtures/igor-users.json
      STEX_IGOR_SESSION_SECRET: ${STEX_STAGING_IGOR_SESSION_SECRET:?generated by the verifier}
    volumes:
      - igor-data:/data/igor
      - ${STEX_STAGING_FIXTURES:?generated by the verifier}:/fixtures:ro
    networks: [studio]

  pantheon:
    depends_on:
      igor: { condition: service_healthy }
    environment:
      STEX_PANTHEON_PUBLIC_ORIGIN: https://pantheon.stex.test:8443
      STEX_INTERNAL_HOSTS: frige,platform,igor
      STEX_IGOR_URL: http://igor:4330
      STEX_PLATFORM_ACTOR_SECRET: ${STEX_STAGING_ACTOR_SECRET:?generated by the verifier}
    ports: !reset []
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/healthz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [studio]

  frige:
    environment:
      STEX_PLATFORM_ACTOR_SECRET: ${STEX_STAGING_ACTOR_SECRET}

  platform:
    environment:
      STEX_KNOWLEDGE_HOSTED: "1"
      STEX_PLATFORM_ACTOR_SECRET: ${STEX_STAGING_ACTOR_SECRET}
      STEX_KNOWLEDGE_IGOR_SECRET: ${STEX_STAGING_KNOWLEDGE_IGOR_SECRET:?generated by the verifier}

volumes:
  igor-data: {}
  edge-data: {}
