# Igor-host overlay (on top of compose.yaml and compose.hosted.yaml): Igor runs with the
# inference service, a Hermes gateway installed by the VM's managed recipe at the exact pin,
# and a recording fake provider, all on the container's loopback, as on the VM. The container
# is on the internal network only, so no real provider or other outside host is reachable.
#
#   node scripts/verify/verify-staging-igor.mjs
services:
  igor:
    image: ${STEX_STAGING_IGOR_HOST_IMAGE:-stex-staging-igor-host}
    build:
      context: ../..
      dockerfile: deploy/staging-compose/igor-host/Dockerfile
      additional_contexts:
        hermes: ${STEX_STAGING_HERMES_SOURCE:?a checkout of the Hermes pin}
        hermes-git: ${STEX_STAGING_HERMES_SOURCE}/.git
        igor-workspace: docker-image://stex-staging-igor-workspace:latest
      args:
        STEX_STAGING_HERMES_SHA: ${STEX_STAGING_HERMES_SHA:-8fc0374447313e276f6b9a2764bfc750190c966a}
        STEX_STAGING_INSTALL_CONNECTOR: ${STEX_STAGING_INSTALL_CONNECTOR:-1}
    environment:
      STEX_STAGING_API_SERVER_KEY: ${STEX_STAGING_API_SERVER_KEY:?generated by the verifier}
      STEX_STAGING_INFERENCE_SECRET: ${STEX_STAGING_INFERENCE_SECRET:?generated by the verifier}
      STEX_STAGING_KNOWLEDGE_IGOR_SECRET: ${STEX_STAGING_KNOWLEDGE_IGOR_SECRET}
    # Hermes finishes in-flight work on SIGTERM; give it time, as systemd does on the VM.
    stop_grace_period: 60s
    volumes:
      # The whole Hermes home: profile, config, state.db and the installed connector. A new
      # volume is seeded from the image; restart and rollback keep using the same one.
      - hermes-home:/home/hermes/.hermes
      # The Hermes checkout persists too, as on the VM: switching runtimes is `git checkout <pin>` plus
      # `./setup-hermes.sh --runtime-only` in place (see verify-staging-igor.mjs), never a different image.
      - hermes-agent:/home/hermes/hermes-agent
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4330/igor/login').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

volumes:
  hermes-home: {}
  hermes-agent: {}
